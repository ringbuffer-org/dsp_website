<!doctype html>
<html>

<head>
  <title>White Noise Burst</title>

  <!-- embedded CSS for slider appearance -------------------------------------->

  <style>
  /* The slider look */
  .minmalslider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 25px;
    background: #d3d3d3;
    outline: none;
  }
  </style>
</head>

<!-- HTML control elements  --------------------------------------------------->

<blockquote style="border: 2px solid #122; padding: 10px; background-color: #ccc;">

  <body>
    <p>White Noise</p>
    <p>
      <button onclick="play()">Play Noise Burst</button>
    </p>
  </body>

</blockquote>


<!-- JavaScript for audio processing ------------------------------------------>

  <script>

    var audioContext = new window.AudioContext

    var gainNode = audioContext.createGain()

    gainNode.gain.value = 0

    gainNode.connect(audioContext.destination)

  
    // callback functions for HTML elements
    function play()
    {
      audioContext.resume()
      gainNode.gain.value = 1
      const oscillator = audioContext.createOscillator()
      oscillator.start(0)
      oscillator.frequency.value = 234
    }
   
  </script>
</html>
